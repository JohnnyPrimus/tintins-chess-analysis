<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="Architecture: Claude Code (terminal) and a browser board both connect into one Python process that holds an MCP server, a shared Stockfish engine + session core, and a FastAPI web server. The FastAPI backend shells out to headless claude -p for in-browser chat." role="img" viewBox="0 0 680 470"><style>text{font-family:-apple-system,system-ui,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.t{font-size:15px;font-weight:600}.lbl,.s{font-size:12px}.lbl{fill:#5f5e5a}</style><rect width="680" height="470" fill="#fff"/><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#73726c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1 L8 5 L2 9"/></marker></defs><g><rect width="160" height="56" x="60" y="40" fill="#f1efe8" stroke="#5f5e5a" rx="10"/><text x="140" y="65" fill="#3d3d3a" class="t" text-anchor="middle">Claude Code</text><text x="140" y="83" fill="#6a6964" class="s" text-anchor="middle">terminal · you ask</text></g><g><rect width="160" height="56" x="460" y="40" fill="#f1efe8" stroke="#5f5e5a" rx="10"/><text x="540" y="65" fill="#3d3d3a" class="t" text-anchor="middle">Browser board</text><text x="540" y="83" fill="#6a6964" class="s" text-anchor="middle">you try moves</text></g><rect width="600" height="180" x="40" y="150" fill="none" stroke="#1f1e1d" stroke-dasharray="5 4" stroke-opacity=".3" rx="18"/><text x="340" y="175" fill="#141413" class="t" text-anchor="middle">One Python process</text><text x="340" y="192" fill="#3d3d3a" class="s" text-anchor="middle">shared engine + one session, started once</text><g><rect width="160" height="96" x="60" y="206" fill="#e1f5ee" stroke="#0f6e56" rx="12"/><text x="140" y="247" fill="#085041" class="t" text-anchor="middle">MCP server</text><text x="140" y="267" fill="#0f6e56" class="s" text-anchor="middle">tools for Claude</text></g><g><rect width="160" height="96" x="260" y="206" fill="#eeedfe" stroke="#534ab7" rx="12"/><text x="340" y="247" fill="#3c3489" class="t" text-anchor="middle">Shared core</text><text x="340" y="267" fill="#534ab7" class="s" text-anchor="middle">engine · session · history</text></g><g><rect width="160" height="96" x="460" y="206" fill="#e1f5ee" stroke="#0f6e56" rx="12"/><text x="540" y="247" fill="#085041" class="t" text-anchor="middle">FastAPI</text><text x="540" y="267" fill="#0f6e56" class="s" text-anchor="middle">serves board + API</text></g><line x1="140" x2="140" y1="96" y2="204" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/><line x1="540" x2="540" y1="96" y2="204" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/><line x1="222" x2="258" y1="254" y2="254" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/><line x1="422" x2="458" y1="254" y2="254" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/><line x1="540" x2="540" y1="302" y2="356" stroke="#73726c" stroke-width="1.5" marker-end="url(#arr)"/><text x="548" y="333" class="lbl">shells out</text><g><rect width="200" height="50" x="420" y="356" fill="#faece0" stroke="#c2763a" rx="10"/><text x="520" y="376" fill="#7a4a1e" class="t" text-anchor="middle">Headless claude -p</text><text x="520" y="394" fill="#a05a23" class="s" text-anchor="middle">in-browser chat · your subscription</text></g><g><rect width="12" height="12" x="84" y="436" fill="#cfcdc4" rx="3"/><text x="102" y="446" class="lbl">you interact</text><rect width="12" height="12" x="214" y="436" fill="#1d9e75" rx="3"/><text x="232" y="446" class="lbl">interface</text><rect width="12" height="12" x="334" y="436" fill="#7f77dd" rx="3"/><text x="352" y="446" class="lbl">engine + state</text><rect width="12" height="12" x="486" y="436" fill="#d99055" rx="3"/><text x="504" y="446" class="lbl">headless chat</text></g></svg>